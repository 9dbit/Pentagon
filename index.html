<html>
  <head>
    <meta charset="UTF-8" />

    <!-- Primary meta -->
    <meta name="description" content="Monitor domain availability, Google rank shifts, provider node health, and suspicious SERP results from one compact command center." />
    <link rel="canonical" href="https://pentagon.quest/" />

    <!-- Open Graph / Telegram / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pentagon" />
    <meta property="og:url" content="https://pentagon.quest/" />
    <meta property="og:title" content="Pentagon — Search Defense Cockpit" />
    <meta property="og:description" content="Monitor domain availability, Google rank shifts, provider node health, and suspicious SERP results from one compact command center." />
    <meta property="og:image" content="https://pentagon.quest/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pentagon — Search Defense Cockpit" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pentagon — Search Defense Cockpit" />
    <meta name="twitter:description" content="Monitor domain availability, Google rank shifts, provider node health, and suspicious SERP results from one compact command center." />
    <meta name="twitter:image" content="https://pentagon.quest/og-image.png" />

    <link rel="stylesheet" href="/sidebar.css" />
    <link rel="stylesheet" href="/app-patches.css" />
    <link rel="stylesheet" href="/logo-rotation.css" />
    <link rel="stylesheet" href="/rank-defense-v2.css" />
    <link rel="stylesheet" href="/serp-alerts-polish.css" />
    <style>
      .badge.working {
        font-size: 0 !important;
      }
      .badge.working::after {
        content: "NORMAL";
        font-size: 9.5px !important;
        font-weight: 1000;
        letter-spacing: .03em;
      }
      .cards .card:nth-child(2) span {
        font-size: 0 !important;
      }
      .cards .card:nth-child(2) span::after {
        content: "NORMAL";
        font-size: 11px !important;
        color: var(--muted);
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: .04em;
      }
      .batteryGauge,
      .signalGauge {
        background: transparent !important;
        border: 0 !important;
        border-radius: 0 !important;
        padding: 3px 0 !important;
        min-height: 40px !important;
      }
      .signalBars span {
        border: 0 !important;
      }
      .nodeTelemetryRow {
        gap: 4px !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/App.jsx"></script>

    <script src="/ui-polish.js" defer></script>
    <script src="/seo-project-ui.js" defer></script>
    <script src="/settings-all-ui.js" defer></script>
  </body>
</html>
