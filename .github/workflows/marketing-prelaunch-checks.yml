name: Pentagon marketing preview verification

on:
  pull_request:
    branches:
      - migration/railway-independence
    paths:
      - "public/learn/**"
      - "public/privacy/**"
      - "public/review/**"
      - "public/whitelist.css"
      - "public/whitelist.js"
      - "Dockerfile.marketing"
      - "server/marketingPreviewServer.js"
      - "server/marketingWhitelistReview.js"
      - "scripts/marketing-start.sh"
      - "scripts/test-pentagon-review-security.cjs"
      - "public/robots.txt"
      - "public/sitemap.xml"
      - "server/marketingStaticRoutes.js"
      - "server/index.js"
      - "scripts/*pentagon-marketing*"
      - "docs/PENTAGON_MARKETING_PRELAUNCH_IMPLEMENTATION_20261018.md"
      - ".github/workflows/marketing-prelaunch-checks.yml"
  push:
    branches:
      - feature/pentagon-marketing-prelaunch-20261018
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pentagon-marketing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marketing-preview:
    name: Marketing static routes and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the marketing-only branch
        uses: actions/checkout@v4
      - name: Use the production Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"
      - name: Verify isolated source and routes
        run: |
          node --check server/marketingStaticRoutes.js
          node --check server/index.js
          node --check scripts/audit-pentagon-marketing-readiness.cjs
          node --check scripts/test-pentagon-marketing-readiness.cjs
          node --check scripts/test-pentagon-marketing-static-local.cjs
          node --check scripts/test-pentagon-marketing-build.cjs
          node --check scripts/test-pentagon-marketing-http.cjs
          node --check scripts/test-pentagon-marketing-design-rc1.cjs
          node --check scripts/test-pentagon-whitelist-smoke.cjs
          node --check server/marketingPreviewServer.js
          node --check server/marketingWhitelistReview.js
          node --check public/review/review.js
          node --check scripts/test-pentagon-review-security.cjs
          node --check public/whitelist.js
          sh -n scripts/marketing-start.sh
          node scripts/test-pentagon-marketing-readiness.cjs
          node scripts/test-pentagon-marketing-static-local.cjs
          node scripts/test-pentagon-marketing-design-rc1.cjs
          node scripts/test-pentagon-whitelist-smoke.cjs
          node scripts/test-pentagon-review-security.cjs
      - name: Build exactly the deployed Dockerfile, no runtime database
        run: docker build --progress plain --tag pentagon-marketing-smoke:ci .
      - name: Validate real Express routes in a credential-free test container
        run: docker run --rm --network bridge --entrypoint node pentagon-marketing-smoke:ci scripts/test-pentagon-marketing-http.cjs
      - name: Extract bundled frontend files without starting the server
        run: |
          set -eu
          cid="$(docker create pentagon-marketing-smoke:ci)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/app/dist" ./dist
      - name: Check build assets and preserved cockpit
        run: node scripts/test-pentagon-marketing-build.cjs ./dist
      - name: Validate isolated marketing preview without database
        run: node scripts/test-pentagon-marketing-preview.cjs
      - name: Build marketing-only Docker image without app services
        run: docker build --file Dockerfile.marketing --tag pentagon-rc1-static:ci .
      - name: Run marketing-only container HTTP and security checks
        run: |
          set -eu
          docker run -d --rm --name pentagon-marketing-rc1-ci -p 127.0.0.1:17345:3000 pentagon-rc1-static:ci
          trap 'docker rm -f pentagon-marketing-rc1-ci >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:17345/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          curl -fsS http://127.0.0.1:17345/learn/ | grep -q 'Your domain defense'
          curl -fsS http://127.0.0.1:17345/robots.txt | grep -q 'Disallow: /'
          curl -fsS http://127.0.0.1:17345/review/ | grep -q 'Authorized reviewers only'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:17345/api/whitelist-review/requests)" = "503"
          curl -fsSI http://127.0.0.1:17345/learn/ | grep -qi 'x-robots-tag: noindex'
          curl -fsSI http://127.0.0.1:17345/sitemap.xml | grep -qi 'content-type: application/xml'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:17345/api/health)" = "404"

