name: Build Pentagon Node APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-node-app/**'
      - 'server/agentPollRoutes.js'
      - '.github/workflows/build-node-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check backend syntax
        run: node --check server/agentPollRoutes.js

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Download Gradle 8.9
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Compile CI debug APK
        working-directory: android-node-app
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PentagonNode-v1.7.1-ci-debug-apk
          path: android-node-app/app/build/outputs/apk/debug/app-debug.apk
