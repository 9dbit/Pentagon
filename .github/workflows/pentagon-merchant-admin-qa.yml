name: Pentagon Merchant Administration tenant isolation
on:
  pull_request:
    paths:
      - "server/customerViewerAuth.js"
      - "server/merchantAdminRoutes.js"
      - "server/merchantOperationsRoutes.js"
      - "server/telegramHub*.js"
      - "server/telegramMerchantReport*.js"
      - "server/telegramMerchantRankScanner.js"
      - "server/rankRoutes.js"
      - "server/telegramPermanentGroups.js"
      - "server/telegramMerchantActivation.js"
      - "server/telegramMerchantAutoProvisioner.js"
      - "telegram_mt_bridge/**"
      - "server/trustpositifAlertOutbox.js"
      - "src/TelegramPermanentGroupsAdmin.*"
      - "server/railway-entry.js"
      - "src/MerchantTelegramHub.*"
      - "src/MerchantTelegramGroupSettings.*"
      - "scripts/test-pentagon-merchant-telegram-settings-menu.cjs"
      - "scripts/test-pentagon-auto-telegram-admin.cjs"
      - "scripts/test-pentagon-telegram-hub*.cjs"
      - "scripts/test-pentagon-telegram-report-formats.cjs"
      - "scripts/test-pentagon-telegram-settings-ui.cjs"
      - "server/trustpositifAlertOutbox.js"
      - "android-node-app/**"
      - "server/merchantDirectChecker.js"
      - "server/merchantNodeTelemetry.js"
      - "server/index.js"
      - "src/App.jsx"
      - "src/MerchantAdminPage.*"
      - "src/MerchantNodeCardV2.jsx"
      - "scripts/test-pentagon-merchant-admin*"
      - "scripts/test-pentagon-merchant-ops.cjs"
      - "scripts/test-pentagon-merchant-telegram-routing.cjs"
      - "scripts/test-pentagon-android-heartbeat-recovery.cjs"
      - "scripts/test-pentagon-merchant-session*"
      - "scripts/test-pentagon-node-health*"
      - ".github/workflows/pentagon-merchant-admin-qa.yml"
  push:
    branches:
      - feature/pentagon-merchant-admin-isolation-20261022
      - feature/pentagon-node-health-v2-20261023
      - feature/merchant-trust-telegram-node-diagnostics-20261023
      - fix/pentagon-apk-poll-telegram-20261023
permissions:
  contents: read
jobs:
  tenant-admin-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: pentagon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pentagon_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CI: "true"
      DATABASE_URL: postgres://postgres:fixture-only@127.0.0.1:5432/pentagon_test
      TRUSTPOSITIF_PREWARM: "false"
      TRUSTPOSITIF_AUTO_WATCH: "false"
      SCHEDULER_ENABLED: "false"
      TRUSTPOSITIF_SCOPED_SCHEDULER: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"
          cache: npm
      - name: Install deps without updating baseline lockfile
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: JavaScript syntax and auth regressions
        run: |
          node --check server/customerViewerAuth.js
          node --check server/merchantAdminRoutes.js
          node --check server/merchantOperationsRoutes.js
          node --check server/merchantDirectChecker.js
          node --check server/merchantNodeTelemetry.js
          node --check server/trustpositifAlertOutbox.js
          node --check server/telegramPermanentGroups.js
          node --check server/telegramMerchantActivation.js
          node --check server/telegramMerchantAutoProvisioner.js
          python -m py_compile telegram_mt_bridge/app.py
          node --check server/telegramHub.js
          node --check server/telegramHubReports.js
          node --check server/telegramMerchantReportFormats.js
          node --check server/telegramMerchantReportData.js
          node --check server/telegramMerchantRankScanner.js
          node --check server/rankRoutes.js
          node --check scripts/test-pentagon-telegram-report-formats.cjs
          node scripts/test-pentagon-telegram-report-formats.cjs
          node --check server/railway-entry.js
          node --check scripts/test-pentagon-telegram-hub.cjs
          node --check scripts/test-pentagon-telegram-hub-pg.cjs
          node scripts/test-pentagon-telegram-hub.cjs
          node scripts/test-pentagon-telegram-settings-ui.cjs
          node --check scripts/test-pentagon-merchant-telegram-settings-menu.cjs
          node scripts/test-pentagon-merchant-telegram-settings-menu.cjs
          node --check scripts/test-pentagon-auto-telegram-admin.cjs
          node scripts/test-pentagon-auto-telegram-admin.cjs
          node --check scripts/test-pentagon-merchant-telegram-routing.cjs
          node --check scripts/test-pentagon-android-heartbeat-recovery.cjs
          node --check scripts/test-pentagon-node-health-v2.cjs
          node --check scripts/test-pentagon-node-health-ui.cjs
          node --check server/index.js
          node --check scripts/test-pentagon-merchant-admin-auth.cjs
          node --check scripts/test-pentagon-merchant-session-migration.cjs
          node --check scripts/test-pentagon-merchant-admin-pg.cjs
          node scripts/test-pentagon-test-account-auth.cjs
          node scripts/test-pentagon-customer-viewer-auth.cjs
          node scripts/test-pentagon-merchant-admin-auth.cjs
          node scripts/test-pentagon-merchant-ops.cjs
          node scripts/test-pentagon-merchant-telegram-routing.cjs
          node scripts/test-pentagon-android-heartbeat-recovery.cjs
          node scripts/test-pentagon-merchant-session-migration.cjs
          node scripts/test-pentagon-node-health-v2.cjs
      - name: Isolated PostgreSQL viewer and merchant tenant firewall
        run: |
          node scripts/test-pentagon-customer-viewer-pg.cjs
          node scripts/test-pentagon-merchant-admin-pg.cjs
          node scripts/test-pentagon-telegram-hub-pg.cjs
      - name: Compile merchant dashboard and existing production UI
        run: |
          node scripts/test-pentagon-node-health-ui.cjs
          npm run build
      - name: Verify SPA shell
        run: node scripts/test-pentagon-production-ui-shell.cjs
      - name: No production credentials or service changes
        run: echo "All tests use CI-local PostgreSQL and reserved example.test fixtures. No production node actions, email, Telegram, registry queries, or live database mutations."
