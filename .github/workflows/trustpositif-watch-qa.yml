name: Pentagon TrustPositif whitelist consensus
on:
  push:
    branches:
      - feature/pentagon-trustpositif-whitelist-consensus-20261020
      - fix/pentagon-trustpositif-scoped-worker-20261020
  pull_request:
    paths:
      - "server/trustpositifWatch.js"
      - "server/railway-entry.js"
      - "scripts/test-pentagon-trustpositif-source-backoff.cjs"
      - "server/trustpositifRoutes.js"
      - "server/scheduler.js"
      - "server/trustpositifAlertOutbox.js"
      - "server/trustpositifReadiness.js"
      - "server/customerWhitelistSync.js"
      - "server/customerViewerAuth.js"
      - "server/customerViewerRoutes.js"
      - "src/CustomerViewerPage.jsx"
      - "src/CustomerViewerPage.css"
      - "scripts/test-pentagon-customer-viewer-auth.cjs"
      - "scripts/test-pentagon-customer-viewer-pg.cjs"
      - "scripts/test-pentagon-test-account-auth.cjs"
      - "server/nodeChecker.js"
      - "server/index.js"
      - "src/TrustPositif*"
      - "src/trust-alert-notification.css"
      - "src/App.jsx"
      - "scripts/test-pentagon-trustpositif-watch-pg.cjs"
      - "scripts/test-pentagon-trustpositif-outbox-pg.cjs"
      - "scripts/test-pentagon-trustpositif-readiness-pg.cjs"
      - "scripts/test-pentagon-customer-whitelist-pg.cjs"
      - "scripts/pentagon-activation-review.cjs"
      - "scripts/test-pentagon-activation-review.cjs"
      - "scripts/pentagon-admin-activation-preview.cjs"
      - "scripts/test-pentagon-admin-activation-preview.cjs"
      - "docs/PENTAGON_SAFE_ACTIVATION_REVIEW_20261020.md"
      - ".github/workflows/trustpositif-watch-qa.yml"
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: pentagon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pentagon_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CI: "true"
      DATABASE_URL: postgres://postgres:fixture-only@127.0.0.1:5432/pentagon_test
      TRUSTPOSITIF_PREWARM: "false"
      TRUSTPOSITIF_AUTO_WATCH: "true"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Configure Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"
          cache: npm
      - name: Install isolated dependencies without rewriting baseline lockfile
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Check monitoring modules
        run: |
          node --check server/trustpositifWatch.js
          node --check server/trustpositifRoutes.js
          node --check server/nodeChecker.js
          node --check server/scheduler.js
          node --check server/trustpositifAlertOutbox.js
          node --check server/trustpositifReadiness.js
          node --check server/customerWhitelistSync.js
          node --check server/customerViewerAuth.js
          node --check server/customerViewerRoutes.js
          node --check scripts/test-pentagon-customer-viewer-auth.cjs
          node --check scripts/test-pentagon-customer-viewer-pg.cjs
          node --check server/index.js
          node --check server/railway-entry.js
          node --check scripts/test-pentagon-trustpositif-source-backoff.cjs
          node --check scripts/test-pentagon-trustpositif-watch-pg.cjs
          node --check scripts/test-pentagon-trustpositif-outbox-pg.cjs
          node --check scripts/test-pentagon-trustpositif-readiness-pg.cjs
          node --check scripts/test-pentagon-customer-whitelist-pg.cjs
          node --check scripts/pentagon-activation-review.cjs
          node --check scripts/test-pentagon-activation-review.cjs
          node --check scripts/pentagon-admin-activation-preview.cjs
          node --check scripts/test-pentagon-admin-activation-preview.cjs
      - name: Source circuit breaker and scoped worker security contract
        run: node scripts/test-pentagon-trustpositif-source-backoff.cjs
      - name: Postgres synthetic whitelist and two-node consensus integration
        run: node scripts/test-pentagon-trustpositif-watch-pg.cjs
      - name: Postgres durable TrustPositif notification outbox
        run: node scripts/test-pentagon-trustpositif-outbox-pg.cjs
      - name: PostgreSQL whitelist reconciliation readiness (strictly read only)
        run: node scripts/test-pentagon-trustpositif-readiness-pg.cjs
      - name: Fail-closed fleet-aware offline activation mapping review
        run: node scripts/test-pentagon-activation-review.cjs
      - name: Administrator monitor-only deduplication without history import
        run: node scripts/test-pentagon-admin-activation-preview.cjs
      - name: Tenant-preserving customer whitelist sync and multi-node alert integration
        run: node scripts/test-pentagon-customer-whitelist-pg.cjs
      - name: Customer viewer hashed login compatibility and API permission firewall
        run: |
          node scripts/test-pentagon-test-account-auth.cjs
          node scripts/test-pentagon-customer-viewer-auth.cjs
      - name: PostgreSQL customer portal tenant isolation and read-only HTTP
        run: node scripts/test-pentagon-customer-viewer-pg.cjs
      - name: Compile current production UI
        run: npm run build
      - name: Verify compiled SPA shell
        run: node scripts/test-pentagon-production-ui-shell.cjs
      - name: UI layout contract
        run: node scripts/test-pentagon-report-layout.cjs
      - name: No live endpoints or credentials
        run: echo "All tested domains use reserved .example names; official lookup and Telegram sends were mocked or source-inspected."
