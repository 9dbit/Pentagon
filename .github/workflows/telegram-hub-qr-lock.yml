name: One-time Pentagon Telegram QR dependency lock

on:
  push:
    branches:
      - feature/telegram-hub-multitenant-20261026
    paths:
      - ".github/workflows/telegram-hub-qr-lock.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/telegram-hub-multitenant-20261026
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned QR dependency and update lock
        run: |
          npm install qrcode.react@4.2.0 --save-exact --package-lock-only --ignore-scripts
          git config user.name pentagon-automation
          git config user.email actions@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m "Pin local QR code renderer for merchant Telegram Hub"
          git fetch origin feature/telegram-hub-multitenant-20261026
          git rebase origin/feature/telegram-hub-multitenant-20261026
          git push origin HEAD:feature/telegram-hub-multitenant-20261026
