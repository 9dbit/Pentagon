<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Verify your email | Pentagon</title>
<style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#080808;color:#f6f6f6}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{max-width:440px;width:100%}header{font-size:13px;letter-spacing:.12em;font-weight:800;color:#fb923c}h1{font-size:29px}p{color:#b6bfca;line-height:1.6}button{border:0;border-radius:999px;background:#f97316;color:#140a03;font:inherit;padding:14px 22px;font-weight:800;cursor:pointer}button:disabled{opacity:.5}a{color:#fca65a}</style></head><body><main><header>PENTAGON / MERCHANT ACCESS</header>
<h1>Confirm your email</h1><p>Verify your address to send your merchant application for review. You will not receive dashboard privileges until approval and password activation.</p>
<button id="confirm" type="button">Verify email</button><p id="status" role="status" aria-live="polite"></p><p><a href="/">Back to Pentagon</a></p></main><script>
const query=new URLSearchParams(location.search),code=query.get("code");
history.replaceState(null,"",location.pathname);
const btn=document.getElementById("confirm"),status=document.getElementById("status");
if(!code){btn.disabled=true;status.textContent="Verification token is missing.";}
btn.addEventListener("click",async()=>{
 btn.disabled=true;status.textContent="Confirming email...";
 try{const r=await fetch("/api/merchant-signup/verify-email",{method:"POST",credentials:"same-origin",cache:"no-store",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:code})});
 if(!r.ok)throw Error(r.status===400?"Expired or previously used link.":"Verification unavailable.");
 status.textContent="Email confirmed. Your merchant application is now pending approval.";
 }catch(e){btn.disabled=false;status.textContent=e.message;}
});
</script></body></html>
